# The reverse proxy: one public port, three kinds of traffic.
#   /api/...  -> Django (REST)
#   /ws/...   -> Django Channels (WebSocket)
#   anything else -> the built React files

upstream backend {
    server backend:8000;
}

server {
    listen 80;

    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ws/ {
        proxy_pass http://backend;
        # A WebSocket starts as an HTTP request asking to "Upgrade". nginx drops
        # these headers by default, so we pass them through explicitly.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # Default is 60s: nginx would cut a quiet socket. Our server sends
        # heartbeats well inside this window (step 3).
        proxy_read_timeout 120s;
    }

    location / {
        root /usr/share/nginx/html;
        # Single-page app: unknown paths serve index.html and React handles them.
        try_files $uri /index.html;
    }
}
